<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <title>QR Code Generator</title>
    <!-- Apply the browser's preferred theme before the page is painted. -->
    <script>
      (() => {
        const root = document.documentElement;
        const media = window.matchMedia("(prefers-color-scheme: dark)");

        const applyTheme = (isDark) => {
          root.classList.toggle("dark", isDark);
        };

        applyTheme(media.matches);

        if (typeof media.addEventListener === "function") {
          media.addEventListener("change", (event) =>
            applyTheme(event.matches),
          );
        } else if (typeof media.addListener === "function") {
          media.addListener((event) => applyTheme(event.matches));
        }

        window.__qrThemeState = {
          applyTheme,
          isDark: () => root.classList.contains("dark"),
        };
      })();
    </script>
    <!-- Base styles keep the first render stable while Tailwind loads. -->
    <style>
      html {
        background-color: #f8fafc;
      }
      html.dark {
        background-color: #0f172a;
      }
      body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      html.dark body {
        background-color: #0f172a;
        color: #f1f5f9;
      }
      button {
        appearance: none;
        font: inherit;
      }
      #generateBtn,
      #colorBtn {
        box-sizing: border-box;
        width: 50px;
        height: 50px;
      }
    </style>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <!-- Tabler Icons CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      [data-darkreader-ignore] {
        color-scheme: light !important;
      }
      #qrcode svg {
        width: 100% !important;
        height: auto !important;
        max-width: 100%;
        display: block;
      }
      #qrcode .qr-module {
        transition: fill 300ms;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 flex items-center justify-center min-h-screen p-4 overflow-x-hidden transition-colors duration-300"
  >
    <div class="flex flex-col items-center space-y-6 max-w-sm w-full my-auto">
      <h1 class="text-2xl font-semibold tracking-wide text-center w-full">
        QR Code Generator
      </h1>

      <!-- Output area: the QR is rendered here and kept on a white background. -->
      <div
        class="bg-white p-4 rounded-2xl shadow-xl w-full box-border"
        data-darkreader-ignore
      >
        <div id="qrcode" class="w-full flex items-center justify-center"></div>
      </div>

      <!-- Main controls: content, correction level, color, and output actions. -->
      <div
        class="w-full space-y-4 bg-white dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-none box-border transition-colors duration-300"
      >
        <!-- Custom Input Field -->
        <div class="flex flex-col space-y-1">
          <label
            for="textInput"
            class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-widest font-medium"
          >
            Content
          </label>
          <input
            type="text"
            id="textInput"
            placeholder="Enter text"
            class="dynamic-border bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-slate-900 dark:text-slate-100 focus:outline-none font-mono text-sm transition-colors duration-300"
            style="--dynamic-focus: #0f172a"
          />
        </div>

        <!-- Error Correction Level Selector -->
        <div class="flex flex-col space-y-1">
          <label
            for="correctLevelSelect"
            class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-widest font-medium"
          >
            Correction Level
          </label>
          <select
            id="correctLevelSelect"
            class="dynamic-border bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-slate-900 dark:text-slate-100 focus:outline-none text-sm cursor-pointer transition-colors duration-300"
            style="--dynamic-focus: #0f172a"
          >
            <option value="L">Low (7%)</option>
            <option value="M" selected>Medium (15%)</option>
            <option value="Q">Quartile (25%)</option>
            <option value="H">High (30%)</option>
          </select>
        </div>

        <!-- Action Buttons Row -->
        <div class="flex items-center space-x-2 pt-2 relative">
          <!-- Refresh / Random Icon Button -->
          <button
            id="generateBtn"
            title="Generate Random 5-Digit Code"
            class="dynamic-bg p-3 rounded-xl shadow text-slate-950 dark:text-slate-100 font-semibold cursor-pointer flex items-center justify-center shrink-0 transition-colors duration-300"
            style="background-color: #0f172a"
          >
            <i id="diceIcon" class="ti ti-dice-5 text-2xl text-white"></i>
          </button>

          <!-- Color Picker Button & Popup Menu -->
          <div class="relative shrink-0">
            <button
              id="colorBtn"
              title="Change Fill Colour"
              class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 p-3 rounded-xl shadow text-slate-800 dark:text-slate-100 cursor-pointer flex items-center justify-center border border-slate-200 dark:border-transparent transition-colors duration-300"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-palette"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                  d="M12 21a9 9 0 0 1 0 -18c4.97 0 9 3.582 9 8c0 1.06 -.474 2.078 -1.318 2.828c-.844 .75 -1.989 1.172 -3.182 1.172h-2.5a2 2 0 0 0 -1 3.75a1.3 1.3 0 0 1 -1 2.25"
                />
                <path d="M7.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                <path d="M11.5 7.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                <path d="M15.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
              </svg>
            </button>

            <!-- Improved Color Picker Popover Menu -->
            <div
              id="colorMenu"
              class="hidden absolute left-0 bottom-full mb-2 w-64 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl p-4 z-50 flex flex-col space-y-3"
            >
              <div class="flex items-center justify-between">
                <span
                  class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider"
                >
                  Colour Picker
                </span>
                <button
                  id="closeColorMenu"
                  class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer"
                >
                  <i class="ti ti-x text-base"></i>
                </button>
              </div>

              <!-- Native Color Picker Row -->
              <div class="flex items-center space-x-3">
                <div
                  class="relative w-10 h-10 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 shrink-0 shadow-inner"
                >
                  <input
                    type="color"
                    id="colorPicker"
                    value="#0f172a"
                    class="absolute -inset-2 w-14 h-14 cursor-pointer p-0 border-0"
                  />
                </div>
                <div class="flex-1 flex flex-col">
                  <label
                    for="hexInput"
                    class="text-[10px] text-slate-400 uppercase tracking-widest font-medium"
                    >Hex Code</label
                  >
                  <input
                    type="text"
                    id="hexInput"
                    value="#0f172a"
                    maxlength="7"
                    class="dynamic-border bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 font-mono text-xs text-slate-800 dark:text-slate-100 focus:outline-none"
                    style="--dynamic-focus: #0f172a"
                  />
                </div>
              </div>

              <!-- Preset Swatches -->
              <div
                class="flex flex-col space-y-1.5 pt-1 border-t border-slate-100 dark:border-slate-700/50"
              >
                <span
                  class="text-[10px] text-slate-400 uppercase tracking-widest font-medium"
                  >Presets</span
                >
                <div class="grid grid-cols-6 gap-2">
                  <button
                    type="button"
                    data-color="#0f172a"
                    class="h-7 rounded-lg bg-slate-900 border border-slate-700 cursor-pointer transition-transform hover:scale-105"
                  ></button>
                  <button
                    type="button"
                    data-color="#059669"
                    class="h-7 rounded-lg bg-emerald-600 cursor-pointer transition-transform hover:scale-105"
                  ></button>
                  <button
                    type="button"
                    data-color="#2563eb"
                    class="h-7 rounded-lg bg-blue-600 cursor-pointer transition-transform hover:scale-105"
                  ></button>
                  <button
                    type="button"
                    data-color="#7c3aed"
                    class="h-7 rounded-lg bg-purple-600 cursor-pointer transition-transform hover:scale-105"
                  ></button>
                  <button
                    type="button"
                    data-color="#dc2626"
                    class="h-7 rounded-lg bg-red-600 cursor-pointer transition-transform hover:scale-105"
                  ></button>
                  <button
                    type="button"
                    data-color="#000000"
                    class="h-7 rounded-lg bg-black cursor-pointer transition-transform hover:scale-105"
                  ></button>
                </div>
              </div>
            </div>
          </div>

          <!-- Combined Split SVG Button -->
          <div
            class="flex flex-1 bg-slate-100 dark:bg-slate-700 rounded-xl shadow border border-slate-200 dark:border-transparent overflow-hidden transition-colors duration-300"
          >
            <!-- Copy Half -->
            <button
              id="copyBtn"
              title="Copy SVG Code to Clipboard"
              class="flex-1 hover:bg-slate-200 dark:hover:bg-slate-600 p-3 text-slate-800 dark:text-slate-100 cursor-pointer flex items-center justify-center space-x-1.5 border-r border-slate-200 dark:border-slate-600 transition-colors duration-300"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-clipboard"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                  d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2"
                />
                <path
                  d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2"
                />
              </svg>
              <span id="copyText" class="text-xs">Copy</span>
            </button>

            <!-- Download Half -->
            <button
              id="downloadBtn"
              title="Download QR as Vector SVG"
              class="flex-1 hover:bg-slate-200 dark:hover:bg-slate-600 p-3 text-slate-800 dark:text-slate-100 cursor-pointer flex items-center justify-center space-x-1.5 transition-colors duration-300"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-download"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
                <path d="M7 11l5 5l5 -5" />
                <path d="M12 4l0 12" />
              </svg>
              <span class="text-xs">SVG</span>
            </button>
          </div>
        </div>

        <!-- Recent History Section -->
        <div
          id="historyContainer"
          class="hidden pt-2 border-t border-slate-200 dark:border-slate-700/50 flex flex-col space-y-1.5 transition-colors duration-300"
        >
          <div class="flex items-center justify-between">
            <button
              id="toggleHistoryBtn"
              type="button"
              aria-expanded="true"
              aria-controls="historyList"
              class="flex items-center gap-1 text-[10px] text-slate-400 dark:text-slate-500 uppercase tracking-widest font-medium cursor-pointer"
            >
              <span>Recent History</span>
              <i id="historyToggleIcon" class="ti ti-chevron-up text-sm"></i>
            </button>
            <button
              id="clearHistoryBtn"
              title="Clear History"
              class="text-[10px] text-slate-400 hover:text-red-500 cursor-pointer transition-colors duration-300"
            >
              Clear
            </button>
          </div>
          <div id="historyList" class="flex flex-wrap gap-1.5"></div>
        </div>
      </div>
    </div>

    <!-- Theme control stays separate from the generator's main controls. -->
    <div
      id="bottomHoverZone"
      class="fixed bottom-0 left-0 w-full h-16 flex items-end justify-center pb-3 group z-50"
    >
      <button
        id="themeToggleBtn"
        title="Toggle Dark/Light Mode"
        class="p-2.5 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 shadow-md cursor-pointer flex items-center justify-center opacity-0 group-hover:opacity-100 pointer-events-none group-hover:pointer-events-auto transition-all duration-300"
      >
        <i id="sunIcon" class="ti ti-sun text-xl hidden leading-none"></i>
        <i id="moonIcon" class="ti ti-moon text-xl leading-none"></i>
      </button>
    </div>

    <script>
      // Cache the page elements once so the helpers below can share them.
      const els = {
        qrContainer: document.getElementById("qrcode"),
        generateBtn: document.getElementById("generateBtn"),
        diceIcon: document.getElementById("diceIcon"),
        colorBtn: document.getElementById("colorBtn"),
        colorMenu: document.getElementById("colorMenu"),
        closeColorMenu: document.getElementById("closeColorMenu"),
        colorPicker: document.getElementById("colorPicker"),
        hexInput: document.getElementById("hexInput"),
        copyBtn: document.getElementById("copyBtn"),
        copyText: document.getElementById("copyText"),
        downloadBtn: document.getElementById("downloadBtn"),
        textInput: document.getElementById("textInput"),
        correctLevelSelect: document.getElementById("correctLevelSelect"),
        themeToggleBtn: document.getElementById("themeToggleBtn"),
        sunIcon: document.getElementById("sunIcon"),
        moonIcon: document.getElementById("moonIcon"),
        historyContainer: document.getElementById("historyContainer"),
        historyList: document.getElementById("historyList"),
        toggleHistoryBtn: document.getElementById("toggleHistoryBtn"),
        historyToggleIcon: document.getElementById("historyToggleIcon"),
        clearHistoryBtn: document.getElementById("clearHistoryBtn"),
      };

      const themeState = window.__qrThemeState || {
        applyTheme: (isDark) =>
          document.documentElement.classList.toggle("dark", isDark),
        isDark: () => document.documentElement.classList.contains("dark"),
      };

      // Shared values used by QR generation and its controls.
      let currentQRColor = "#0f172a";
      let qrCodeInstance = null;
      let currentCodeIsRandom = false;
      let diceRollAnimation = null;

      // Theme toggle updates the page class and keeps its icons in sync.
      const theme = {
        syncIcons() {
          const isDark = themeState.isDark();
          els.sunIcon.classList.toggle("hidden", !isDark);
          els.moonIcon.classList.toggle("hidden", isDark);
        },
        bindToggle() {
          els.themeToggleBtn.addEventListener("click", () => {
            const nextIsDark = !themeState.isDark();
            themeState.applyTheme(nextIsDark);
            theme.syncIcons();
          });
        },
      };

      // QR generation, color updates, SVG rendering, and color-menu events.
      const qr = {
        getCorrectionLevel(level) {
          const correctionLevels = {
            L: QRCode.CorrectLevel.L,
            M: QRCode.CorrectLevel.M,
            Q: QRCode.CorrectLevel.Q,
            H: QRCode.CorrectLevel.H,
          };
          return correctionLevels[level] ?? correctionLevels.M;
        },
        getBackgroundColor() {
          return "#ffffff";
        },
        init(text, level) {
          els.qrContainer.innerHTML = "";
          qrCodeInstance = new QRCode(els.qrContainer, {
            text,
            width: 500,
            height: 500,
            colorDark: currentQRColor,
            colorLight: qr.getBackgroundColor(),
            correctLevel: qr.getCorrectionLevel(level),
          });
          qr.renderSVG();
        },
        update(text) {
          const level = els.correctLevelSelect.value;
          const content = text || " ";

          if (
            !qrCodeInstance ||
            qrCodeInstance._htOption.correctLevel !==
              qr.getCorrectionLevel(level)
          ) {
            qr.init(content, level);
            return;
          }

          qrCodeInstance.makeCode(content);
          qr.renderSVG();
        },
        applyColor(hex) {
          if (!/^#[0-9A-F]{6}$/i.test(hex)) return;

          currentQRColor = hex;
          els.colorPicker.value = hex;
          els.hexInput.value = hex;

          els.generateBtn.style.backgroundColor = hex;
          document.querySelectorAll(".dynamic-border").forEach((el) => {
            el.style.setProperty("--dynamic-focus", hex);
            el.style.borderColor = "";
          });

          els.qrContainer.querySelectorAll(".qr-module").forEach((module) => {
            module.setAttribute("fill", hex);
          });
        },
        getVectorSVGString() {
          const qrObj = qrCodeInstance && qrCodeInstance._oQRCode;
          if (!qrObj || !qrObj.modules) return null;

          const modules = qrObj.modules;
          const size = modules.length;
          const fillColor = currentQRColor;
          const backgroundColor = qr.getBackgroundColor();

          let rects = "";
          for (let row = 0; row < size; row++) {
            for (let col = 0; col < size; col++) {
              if (modules[row][col]) {
                rects += `<rect class="qr-module" x="${col}" y="${row}" width="1" height="1" fill="${fillColor}"/>\n`;
              }
            }
          }

          return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">
            <rect width="${size}" height="${size}" fill="${backgroundColor}"/>
            ${rects}
          </svg>`;
        },
        renderSVG() {
          const svgString = qr.getVectorSVGString();
          if (svgString) {
            els.qrContainer.innerHTML = svgString;
          }
        },
        bindEvents() {
          els.colorBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            els.colorMenu.classList.toggle("hidden");
          });

          els.closeColorMenu.addEventListener("click", () => {
            els.colorMenu.classList.add("hidden");
          });

          document.addEventListener("click", (event) => {
            if (
              !els.colorMenu.contains(event.target) &&
              !els.colorBtn.contains(event.target)
            ) {
              els.colorMenu.classList.add("hidden");
            }
          });

          els.colorPicker.addEventListener("input", (event) => {
            qr.applyColor(event.target.value);
          });

          els.hexInput.addEventListener("input", (event) => {
            let value = event.target.value;
            if (!value.startsWith("#")) value = `#${value}`;

            if (/^#[0-9A-F]{0,6}$/i.test(value)) {
              els.hexInput.value = value;
              if (value.length === 7) qr.applyColor(value);
            }
          });

          document.querySelectorAll("[data-color]").forEach((button) => {
            button.addEventListener("click", () => {
              qr.applyColor(button.getAttribute("data-color"));
            });
          });

          document.querySelectorAll(".dynamic-border").forEach((element) => {
            element.addEventListener("focus", () => {
              element.style.borderColor =
                element.style.getPropertyValue("--dynamic-focus");
            });
            element.addEventListener("blur", () => {
              element.style.borderColor = "";
            });
          });
        },
      };

      // Recent entries are stored in localStorage and rendered as buttons.
      const history = {
        get() {
          try {
            const stored = localStorage.getItem("qr_history");
            return stored ? JSON.parse(stored) : [];
          } catch (error) {
            return [];
          }
        },
        save(text) {
          if (!text || text.trim() === "") return;

          let items = history.get();
          items = items.filter((item) => item !== text.trim());
          items.unshift(text.trim());
          if (items.length > 20) items.pop();

          localStorage.setItem("qr_history", JSON.stringify(items));
          history.render();
        },
        saveCurrent() {
          if (!currentCodeIsRandom) {
            history.save(els.textInput.value);
          }
        },
        render() {
          const items = history.get();
          els.historyList.innerHTML = "";

          if (items.length === 0) {
            els.historyContainer.classList.add("hidden");
            els.historyList.classList.remove("hidden");
            els.toggleHistoryBtn.setAttribute("aria-expanded", "true");
            els.historyToggleIcon.classList.replace(
              "ti-chevron-down",
              "ti-chevron-up",
            );
            return;
          }

          els.historyContainer.classList.remove("hidden");
          items.forEach((item) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className =
              "bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded-lg text-xs font-mono truncate max-w-[180px] transition-colors duration-300 cursor-pointer";
            btn.textContent = item;
            btn.title = item;
            btn.addEventListener("click", () => {
              currentCodeIsRandom = false;
              els.textInput.value = item;
              qr.update(item);
            });
            els.historyList.appendChild(btn);
          });
        },
        bindToggle() {
          els.toggleHistoryBtn.addEventListener("click", () => {
            const isExpanded =
              els.toggleHistoryBtn.getAttribute("aria-expanded") === "true";

            els.toggleHistoryBtn.setAttribute(
              "aria-expanded",
              String(!isExpanded),
            );
            els.historyList.classList.toggle("hidden", isExpanded);
            els.historyToggleIcon.classList.toggle(
              "ti-chevron-up",
              !isExpanded,
            );
            els.historyToggleIcon.classList.toggle(
              "ti-chevron-down",
              isExpanded,
            );
          });

          els.clearHistoryBtn.addEventListener("click", () => {
            localStorage.removeItem("qr_history");
            history.render();
          });
        },
      };

      // Shared export preparation: get the current SVG and save its text.
      function getSvgAndSave() {
        const svgString = qr.getVectorSVGString();
        if (!svgString) return null;
        history.saveCurrent();
        return svgString;
      }

      // Connect text input and action buttons to the QR and history helpers.
      function bindTextAndControls() {
        els.textInput.addEventListener("input", (event) => {
          currentCodeIsRandom = false;
          qr.update(event.target.value);
        });

        els.textInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            history.saveCurrent();
          }
        });

        els.correctLevelSelect.addEventListener("change", () => {
          qr.update(els.textInput.value);
        });

        els.generateBtn.addEventListener("click", () => {
          const randomCode = Math.floor(
            10000 + Math.random() * 90000,
          ).toString();
          const randomDice = Math.floor(Math.random() * 6) + 1;
          els.diceIcon.className = `ti ti-dice-${randomDice} text-2xl text-white`;

          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            diceRollAnimation?.cancel();
            diceRollAnimation = els.diceIcon.animate(
              [
                { transform: "translateY(0) rotate(0deg)" },
                { transform: "translateY(-5px) rotate(180deg)" },
                { transform: "translateY(0) rotate(360deg)" },
              ],
              {
                duration: 450,
                easing: "cubic-bezier(0.2, 0.8, 0.2, 1)",
              },
            );
          }

          els.textInput.value = randomCode;
          currentCodeIsRandom = true;
          qr.update(randomCode);
        });

        els.copyBtn.addEventListener("click", () => {
          const svgString = getSvgAndSave();
          if (!svgString) return;

          navigator.clipboard.writeText(svgString).then(() => {
            const originalText = els.copyText.textContent;
            els.copyText.textContent = "Copied!";
            els.copyBtn.style.color = currentQRColor;
            els.copyBtn.classList.add("font-semibold");

            setTimeout(() => {
              els.copyText.textContent = originalText;
              els.copyBtn.style.color = "";
              els.copyBtn.classList.remove("font-semibold");
            }, 1500);
          });
        });

        els.downloadBtn.addEventListener("click", () => {
          const svgString = getSvgAndSave();
          if (!svgString) return;

          const safeFilename = (els.textInput.value || "code")
            .replace(/[^a-z0-9]/gi, "_")
            .toLowerCase();
          const blob = new Blob([svgString], {
            type: "image/svg+xml;charset=utf-8",
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `qrcode-${safeFilename}.svg`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        });
      }

      // Start the app after helpers and element references are ready.
      function init() {
        theme.syncIcons();
        theme.bindToggle();
        qr.bindEvents();
        history.bindToggle();
        bindTextAndControls();
        history.render();
        qr.init(els.textInput.value || " ", els.correctLevelSelect.value);
      }

      init();
    </script>
  </body>
</html>
